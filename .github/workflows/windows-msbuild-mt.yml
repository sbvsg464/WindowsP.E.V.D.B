name: Windows MSVC Direct CLI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.arch_name }}
    runs-on: windows-latest # 微软官方提供的原生环境，内置了完整 MSVC 命令行工具链

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: x86_64
            msvc_arch: x64         # 原生 x64 编译器
          - arch_name: x86_i386
            msvc_arch: x86         # 原生 x86 编译器
          - arch_name: ARM64
            msvc_arch: x64_arm64   # 使用 x64 宿主机交叉编译成 ARM64 程序

    steps:
    # 1. 拉取代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🛡️ 核心修复 1：强行关闭云端 Windows Defender 的实时监控，防止编译产物被当成病毒秒删
    - name: Disable Windows Defender
      run: Set-MpPreference -DisableRealtimeMonitoring $true
      shell: powershell

    # 2. 初始化 MSVC 命令行环境变量
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    # 3. 编译（代码保持不变）
    - name: Compile with cl.exe
      run: |
        $CppFiles = Get-ChildItem -Path . -Filter *.cpp -Recurse | Select-Object -ExpandProperty FullName
        cl.exe /EHsc /O2 /MT /std:c++latest /utf-8 /Fe:WPEVDB_base.exe $CppFiles user32.lib shell32.lib advapi32.lib userenv.lib wtsapi32.lib netapi32.lib wevtapi.lib

    # 重命名（代码保持不变）
    - name: Rename Executable
      run: |
        Rename-Item -Path "WPEVDB_base.exe" -NewName "WPEVDB_${{ matrix.arch_name }}.exe"
      
    # 4. 上传
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WPEVDB-${{ matrix.arch_name }}
        # 🎯 核心修复 2：去掉 **/ 通配符，直接精准指向当前目录下的 exe
        path: WPEVDB_${{ matrix.arch_name }}.exe
    